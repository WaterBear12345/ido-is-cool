}
const liveKey = i => S.live.log[i].k;
/* Plate width and drawn height per plate, in the drawing's 320-wide units. */
const PLATE_W = {25:13, 20:12, 15:11, 10:10, 5:8, 2.5:6, 1.25:5};
const PLATE_H = {25:74, 20:70, 15:64, 10:57, 5:46, 2.5:37, 1.25:30};
/* Every kind of equipment gets a drawing: the barbell's plates, a pair of dumbbells, a
   weight stack with its pin (and a pulley for cables), or a single free weight. */
function equipViz(total, e, i){
  if (e.kind === "bar") return plateRow(total, e, i);
  if (e.kind === "db") return dbViz(total);
  if (e.kind === "free") return freeViz(total);
  return stackViz(total, e.kind === "cable");
}
function dbViz(total){
  const f = Math.max(0, Math.min(1, total / 40)), hw = 9 + 9 * f, hh = 30 + 34 * f, cy = 42;
  const one = cx => {
    const h = cx - 24, rgt = cx + 24;
    return `<rect class="shaft" x="${h}" y="${cy - 3.5}" width="48" height="7" rx="3"/>
      <rect class="iron" x="${h - hw}" y="${cy - hh / 2}" width="${hw}" height="${hh}" rx="3"/>
      <rect class="iron" x="${rgt}" y="${cy - hh / 2}" width="${hw}" height="${hh}" rx="3"/>
      <rect class="iron" x="${h - hw - 5}" y="${cy - hh * .32}" width="5" height="${hh * .64}" rx="2"/>
      <rect class="iron" x="${rgt + hw}" y="${cy - hh * .32}" width="5" height="${hh * .64}" rx="2"/>`;
  };
  return `<div class="viz" data-viz="db"><svg viewBox="0 0 320 84" role="img" aria-label="Two ${kg(total)} kg dumbbells">
      ${one(92)}${one(228)}</svg>
    <div class="platechips"><span class="pc">${kg(total)} kg</span><span>in each hand</span>
      <span style="margin-left:auto">${kg(total * 2)} kg total</span></div></div>`;
}
function freeViz(total){
  const f = Math.max(0, Math.min(1, total / 32)), r = 22 + 10 * f, cx = 160, cy = 84 - r - 3;
  return `<div class="viz" data-viz="free"><svg viewBox="0 0 320 84" role="img" aria-label="A ${kg(total)} kg weight">
      <path class="rope" d="M${cx - r * .55} ${cy - r * .7}V${cy - r - 6}a${r * .55} ${r * .55} 0 0 1 ${r * 1.1} 0V${cy - r * .7}"
        style="stroke:var(--ink);stroke-width:6"/>
      <circle class="iron" cx="${cx}" cy="${cy}" r="${r}"/>
      <text class="ironlbl" x="${cx}" y="${cy + 5}">${kg(total)}</text></svg>
    <div class="platechips"><span class="pc">${kg(total)} kg</span><span>one weight, held in both hands</span></div></div>`;
}
/* Illustrative stack: ten slabs, the lifted ones raised above the rest with the pin under
   them. Real stacks vary, so the label gives the weight, not a plate count. */
function stackViz(total, cable){
  const step = [2.5, 5, 10, 20, 40].find(st => total / st <= 8) || 40;
  const n = 10, up = Math.max(1, Math.min(n, Math.round(total / step)));
  const cx = cable ? 132 : 160, w = 92, x0 = cx - w / 2, sh = 5, gap = 1.3, base = 81, lift = 6;
  let slabs = "";
  for (let j = 0; j < n; j++){                 /* j = 0 is the top slab */
    const lifted = j < up, y = base - (n - j) * (sh + gap) - (lifted ? lift : 0);
    slabs += `<rect class="slab${lifted ? " up" : ""}" x="${x0}" y="${y.toFixed(1)}" width="${w}" height="${sh}" rx="1.5"/>`;
  }
  const pinY = base - (n - up + 1) * (sh + gap) - lift + sh / 2;
  const topY = base - n * (sh + gap) - lift;
  const top = cable
    ? `<path class="rope" d="M${cx} ${topY}V6H${cx + 96}"/><circle cx="${cx + 96}" cy="14" r="8" class="rope"/>
       <path class="rope" d="M${cx + 104} 14V52"/><path class="rope" d="M${cx + 94} 52h20l-3 12h-14z" style="stroke:var(--ink)"/>`
    : `<path class="rope" d="M${cx} ${topY}V3"/>`;
  return `<div class="viz" data-viz="${cable ? "cable" : "stack"}"><svg viewBox="0 0 320 84" role="img"
      aria-label="${cable ? "Cable" : "Machine"} stack, pin at ${kg(total)} kg">
      <path class="rail" d="M${x0 - 6} 4V82M${x0 + w + 6} 4V82"/>${top}${slabs}
      <rect class="pin" x="${x0 + w - 4}" y="${(pinY - 1.6).toFixed(1)}" width="26" height="3.2" rx="1.6"/>
      <circle class="pin" cx="${x0 + w + 24}" cy="${pinY.toFixed(1)}" r="4"/></svg>
    <div class="platechips"><span>Pin at</span><span class="pc">${kg(total)} kg</span>
      <span>on the ${cable ? "cable" : "machine"} stack</span></div></div>`;
}
function plateRow(total, e, i){
  const bar = e.barKg || BARBELL, b = plateBreak(total, bar);
  const barBtn = i === undefined ? "" :
    `<button class="barkg" data-barkg="${i}" aria-label="Bar weight, tap to switch">${bar} kg bar ⇄</button>`;
  if (!b) return `<div class="platechips">Lighter than the ${bar} kg bar on its own${barBtn}</div>`;
  if (!b.plates.length) return `<div class="platechips">Just the empty ${bar} kg bar${barBtn}</div>`;
  /* A bar as it looks: a long grip between two collars near the ends, plates loaded
     outward from each collar, heaviest innermost. Very heavy loads narrow to fit. */
  const cy = 42, start = 251, room = 318 - start;
  const need = b.plates.reduce((a, [w]) => a + PLATE_W[w] + 1.5, 0), fit = Math.min(1, room / need);
  let right = "", left = "", x = start;
  for (const [w, col] of b.plates){
    const pw = PLATE_W[w] * fit, ph = PLATE_H[w];
    right += `<rect class="pl8" x="${x.toFixed(1)}" y="${cy - ph / 2}" width="${pw.toFixed(1)}" height="${ph}" rx="2" style="fill:${col}"/>`;
    left  += `<rect class="pl8" x="${(320 - x - pw).toFixed(1)}" y="${cy - ph / 2}" width="${pw.toFixed(1)}" height="${ph}" rx="2" style="fill:${col}"/>`;
    x += pw + 1.5 * fit;
  }
  const counts = {};
  for (const [w] of b.plates) counts[w] = (counts[w] || 0) + 1;
  const ws = Object.keys(counts).map(Number).sort((a, c) => c - a);
  const said = ws.map(w => `${counts[w] > 1 ? counts[w] + " × " : ""}${w}`).join(", ");
  return `<div class="viz plates" data-viz="bar" data-perside="${b.plates.map(p => p[0]).join(",")}" data-bar="${bar}">
    <svg viewBox="0 0 320 84" role="img" aria-label="Per side: ${said} kg, on a ${bar} kg bar">
      <rect class="shaft" x="4" y="37" width="72" height="10" rx="3"/>
      <rect class="shaft" x="244" y="37" width="72" height="10" rx="3"/>
      <rect class="shaft" x="76" y="39" width="168" height="6" rx="3"/>
      <rect class="collar" x="239" y="31" width="10" height="22" rx="2"/>
      <rect class="collar" x="71" y="31" width="10" height="22" rx="2"/>
      ${left}${right}
    </svg>
    <div class="platechips"><span>Per side</span>${ws.map(w => {
      const col = PLATES.find(p => p[0] === w)[1];
      return `<span class="pc"><i style="background:${col}"></i>${counts[w] > 1 ? counts[w] + " × " : ""}${w}</span>`;
    }).join("")}${b.left ? `<span>+${b.left} kg short</span>` : ""}${barBtn}</div>
  </div>`;
}

function wireLive(){
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const i = +b.dataset.open;
    S.live.open = (S.live.open === i) ? -1 : i;
    save(); render();
  });
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    const [i, si] = b.dataset.set.split(":").map(Number);
    openPad(i, si);
  });
  document.querySelectorAll("[data-rr]").forEach(b => b.onclick = () => {
    const i = +b.dataset.rr; rrOpen = rrOpen === i ? -1 : i; render();
  });
  document.querySelectorAll("[data-rrb]").forEach(b => b.onclick = () => {
    const [i, end, d] = b.dataset.rrb.split(":"), x = S.live.log[+i], e = S.prog.ex[x.k] || x;
    let lo = e.lo, hi = e.hi;
    if (end === "lo") lo = Math.max(1, Math.min(hi, lo + +d)); else hi = Math.max(lo, Math.min(50, hi + +d));
    e.lo = x.lo = lo; e.hi = x.hi = hi;
    save(); render();
  });
  document.querySelectorAll("[data-barkg]").forEach(b => b.onclick = () => {
    const x = S.live.log[+b.dataset.barkg], e = S.prog.ex[x.k] || x;
    e.barKg = x.barKg = (e.barKg || BARBELL) === 20 ? 25 : 20;
    save(); render();
  });
  document.querySelectorAll("[data-nset]").forEach(b => b.onclick = () => {
    const [i, d] = b.dataset.nset.split(":").map(Number), x = S.live.log[i];
    if (d > 0 && x.reps.length < MAXSETS) x.reps.push(null);
    if (d < 0 && x.reps.length > 1) x.reps.pop();
    save(); render();
  });
  document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
    const [i, dir] = b.dataset.w.split(":").map(Number);
    const x = S.live.log[i], e = liveDef(x);
    const step = e.kind === "db" ? 2 : e.kind === "free" ? (e.inc || 2.5) : 2.5;
    x.weight = Math.max(0, Math.round(((x.weight || 0) + dir * step) * 100) / 100);
    if (S.prog.ex[x.k]) S.weights[x.k] = x.weight;
    save(); render();
  });
  const f = document.getElementById("fin");
  if (f) f.onclick = finishSession;
  const a = document.getElementById("abandon");
  if (a) a.onclick = () => {
    if (confirm("Discard this session? Nothing will be saved.")){ S.live = null; rrOpen = -1; save(); render(); }
  };
}

/* ── plan ──────────────────────────────────────────────────────────────── */
function planSub(){
  const n = S.prog.order.length, t = S.prog.order.reduce((a, id) => a + setsOf(S.prog.sessions[id]), 0);
  return `${n} session${n === 1 ? "" : "s"} a week, ${t} working sets`;
}
const rowSub = (k, n) => {
  const e = S.prog.ex[k];
  return `${n} × ${e.lo}–${e.hi} reps · +${kg(e.inc)} kg · ${mmss(e.rest)} rest${usedIn(k).length > 1 ? " · shared" : ""}`;
};
const restSel = v => {
  const opts = REST_OPTS.includes(v) ? REST_OPTS : [...REST_OPTS, v].sort((a, b) => a - b);
  return `<select data-f="rest">${opts.map(o =>
    `<option value="${o}"${o === v ? " selected" : ""}>${restLabel(o)}</option>`).join("")}</select>`;
};
function planView(){
  let h = `<div class="card"><p>Tap an exercise to change its sets, rep range, increment or weight.
    Tap a day to move a session. Sessions that share an exercise share its weight.</p></div>`;
  for (const id of S.prog.order){
    const s = S.prog.sessions[id];
    h += `<div class="sess">
      <div class="sess-head">
        <div class="row"><input data-rename="${id}" value="${esc(s.name)}" aria-label="Session name" maxlength="24">
          ${S.live && S.live.id === id ? `<span class="nowtag">In progress</span>` : ""}
          <span class="cnt">${setsOf(s)} sets</span>
          ${S.prog.order.length > 1 ? `<button class="del" data-delsess="${id}">Delete</button>` : ""}</div>
        <div class="days">${DAYS.map((d, i) =>
          `<button data-day="${id}:${i}" class="${s.day === i ? "on" : ""}" aria-label="${DAYFULL[i]}">${d.slice(0, 2)}</button>`).join("")}</div>
      </div>`;
    s.plan.forEach(([k, n], i) => {
      const e = S.prog.ex[k], on = !!edit && edit.id === id && edit.i === i;
      h += `<button class="pl${on ? " on" : ""}" data-edit="${id}:${i}">
        ${icon(e, "sm")}
        <div class="nm"><b>${esc(e.name)}</b>
          <span>${rowSub(k, n)}</span></div>
        <div class="kg">${kg(S.weights[k])}<small>kg</small></div></button>`;
      if (on) h += editForm(id, i, k, n);
    });
    if (!s.plan.length) h += `<p class="hint" style="margin:12px 16px 0">No exercises yet.</p>`;
    if (edit && edit.id === id && edit.i === -1) h += addForm(id);
    else h += `<button class="addex" data-add="${id}">+ Add exercise</button>`;
    h += `</div>`;
  }
  h += `<div class="pick" style="margin-top:4px">
    <button data-addsess><b>+ New session</b><span>e.g. a third lower day</span></button>
    <button data-resetprog><b>Reset programme</b><span>Back to the default plan</span></button></div>`;
  return h;
}

/* The fields shared by the edit and add forms. `a` is extra attributes for every cell. */
const numStep = (f, v) => `<div class="stp"><button data-bump="${f}:-1" aria-label="Lower">−</button>
  <input data-f="${f}" type="number" inputmode="numeric" min="1" value="${v}"><button data-bump="${f}:1" aria-label="Higher">+</button></div>`;
function exFields(e, w, a = "", isNew = false){
  const kind = KINDS.some(([v]) => v === e.kind) ? e.kind : "machine", bar = kind === "bar";
  return `
    <div class="wide"${a}><label>Name</label><input data-f="name" value="${esc(e.name || "")}" maxlength="40"
      ${isNew ? 'placeholder="e.g. Overhead extensions"' : ""}></div>
    <div class="wide"${a}><label>Muscles</label><div class="mpick">${MUSCLE_ORDER.map(g => {
      const ms = e.group ? musclesOf(e) : [], on = ms.includes(g);
      return `<label style="color:${gcol(g)}"${ms[0] === g ? ' class="main"' : ""}><input type="checkbox" name="group" value="${g}"${on ? " checked" : ""}>`
        + `${figure(g)}<span style="color:var(--ink)">${MUSCLE[g].n}</span></label>`;
    }).join("")}</div>
      <p class="hint">Pick every muscle it trains. The first one you pick is its main muscle, which sets its colour and its place in Progress.</p></div>
    <div class="wide"${a}><label>Equipment</label><div class="seg eqs">${KINDS.map(([v, l]) =>
      `<label><input type="radio" name="kind" value="${v}"${kind === v ? " checked" : ""}>`
      + `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[v]}</svg>${l}</label>`).join("")}</div></div>
    <div class="wide" data-when="bar"${a}${bar ? "" : " hidden"}><label>Bar weight</label><div class="seg">${BARS.map(b =>
      `<label><input type="radio" name="barKg" value="${b}"${(e.barKg || BARBELL) === b ? " checked" : ""}>${b} kg</label>`).join("")}</div></div>
    <div${a}><label>Reps from</label>${numStep("lo", e.lo)}</div>
    <div${a}><label>Reps to</label>${numStep("hi", e.hi)}</div>
    <div${a}><label>Increment, kg</label><input data-f="inc" type="number" inputmode="decimal" step="0.5" min="0" value="${e.inc}"></div>
    <div${a}><label>Rest between sets</label>${restSel(e.rest)}</div>
    <div class="wide"${a}><label>${isNew ? "Starting" : "Current"} weight, kg</label><input data-f="w" type="number" inputmode="decimal" step="0.5" min="0" value="${w}"></div>`;
}
const setsStep = n => `<div class="wide"><label>Sets in this session</label>
  <div class="stp"><button data-sets="-1" aria-label="Fewer sets">−</button><b>${n}</b><button data-sets="1" aria-label="More sets">+</button></div></div>`;

function editForm(id, i, k, n){
  const e = S.prog.ex[k], shared = usedIn(k).filter(x => x !== id).map(x => S.prog.sessions[x].name);
  return `<div class="edit">
    <div class="f">${setsStep(n)}${exFields(e, S.weights[k])}</div>
    ${shared.length ? `<p class="hint">Also in ${esc(listJoin(shared))}. Everything but the set count is shared.</p>` : ""}
    <div class="acts">
      <button data-move="-1" aria-label="Move up">↑</button><button data-move="1" aria-label="Move down">↓</button>
      <button class="warn" data-remove>Remove</button><button class="primary" data-save>Save</button></div>
  </div>`;
}

function addForm(id){
  const s = S.prog.sessions[id], inSess = new Set(s.plan.map(p => p[0]));
  const others = Object.keys(S.prog.ex).filter(k => !inSess.has(k));
  const opt = k => {
    const u = usedIn(k), e = S.prog.ex[k];
    const where = u.length ? `shares weight with ${u.map(x => S.prog.sessions[x].name).join(", ")}` : "not in any session";
    return `<option value="${k}">${esc(e.name)}, ${e.lo}–${e.hi} reps, ${kg(S.weights[k])} kg (${esc(where)})</option>`;
  };
  const fresh = {name:"", lo:8, hi:10, inc:2.5, rest:90, kind:"machine", barKg:BARBELL, group:null};
  return `<div class="edit">
    <div class="f">
      <div class="wide"><label>Exercise</label><select data-f="src"><option value="">New exercise…</option>${others.map(opt).join("")}</select></div>
      ${setsStep(edit.n)}${exFields(fresh, 20, " data-newonly", true)}
    </div>
    <p class="hint" data-existonly hidden>Picking an existing exercise shares its weight with the other session it is in. Only do that when the rep range is the same in both.</p>
    <div class="acts"><button data-cancel>Cancel</button><button class="primary" data-save>Add</button></div>
  </div>`;
}

function wirePlan(){
  /* Save a plan change, carry it into the running workout, and say so when it did. */
  const planned = (msg = "") => {
    const hit = syncLive();
    save();
    const note = hit ? "Your workout in progress is updated too." : "";
    if (msg || note) toast([msg, note].filter(Boolean).join(" "));
  };
  const v = document.getElementById("view");
  v.querySelectorAll("[data-rename]").forEach(inp => inp.onchange = () => {
    const nm = inp.value.trim();
    if (nm) S.prog.sessions[inp.dataset.rename].name = nm;
    save(); render();
  });
  v.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    const [id, d] = b.dataset.day.split(":"), day = +d, s = S.prog.sessions[id];
    if (s.day === day) s.day = null;
    else {
      for (const o of S.prog.order) if (o !== id && S.prog.sessions[o].day === day){
        S.prog.sessions[o].day = null;
        toast(`${S.prog.sessions[o].name} no longer has a day.`);
      }
      s.day = day;
    }
    save(); render();
  });
  v.querySelectorAll("[data-delsess]").forEach(b => b.onclick = () => {
    const id = b.dataset.delsess, s = S.prog.sessions[id];
    const running = S.live && S.live.id === id;
    if (!confirm(`Delete ${s.name}? Logged sessions stay in your history.`
      + (running ? " It is also the workout in progress, which will be discarded." : ""))) return;
    S.prog.order = S.prog.order.filter(x => x !== id);
    delete S.prog.sessions[id];
    if (S.live && S.live.id === id) S.live = null;
    edit = null; save(); render();
  });
  v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const [id, i] = b.dataset.edit.split(":");
    edit = (edit && edit.id === id && edit.i === +i) ? null : {id, i:+i};
    render();
  });
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    edit = {id:b.dataset.add, i:-1, n:2}; render();
  });
  const addSess = v.querySelector("[data-addsess]");
  if (addSess) addSess.onclick = () => {
    let id = "s" + Date.now().toString(36);
    while (S.prog.sessions[id]) id += "x";
    S.prog.sessions[id] = {name:"New session", day:null, plan:[]};
    S.prog.order.push(id);
    edit = {id, i:-1, n:2};
    save(); render();
    const el = v.querySelector(`[data-rename="${id}"]`);
    if (el) el.scrollIntoView({block:"center"});
  };
  const reset = v.querySelector("[data-resetprog]");
  if (reset) reset.onclick = () => {
    if (!confirm("Put the programme back to the default plan? Your weights and history are kept.")) return;
    const old = S.weights;
    S.prog = defaultProg();
    for (const k in S.prog.ex) if (typeof old[k] !== "number") S.weights[k] = S.prog.ex[k].start;
    edit = null; planned("Programme reset."); render();
  };

  const form = v.querySelector(".edit");
  if (!form || !edit) return;
  const s = S.prog.sessions[edit.id];
  const get = f => form.querySelector(`[data-f="${f}"]`);
  /* The stepper changes the count in place rather than re-rendering, so typed fields survive. */
  form.querySelectorAll("[data-sets]").forEach(b => b.onclick = () => {
    const d = +b.dataset.sets;
    let n;
    if (edit.i >= 0){ n = s.plan[edit.i][1] = Math.min(MAXSETS, Math.max(1, s.plan[edit.i][1] + d)); planned(); }
    else n = edit.n = Math.min(MAXSETS, Math.max(1, edit.n + d));
    b.parentElement.querySelector("b").textContent = n;
    if (edit.i >= 0){
      const row = form.previousElementSibling.querySelector(".nm span");
      if (row) row.textContent = rowSub(s.plan[edit.i][0], n);
      form.closest(".sess").querySelector(".cnt").textContent = `${setsOf(s)} sets`;
      document.getElementById("hSub").textContent = planSub();
    }
  });
  form.querySelectorAll("[data-move]").forEach(b => b.onclick = () => {
    const j = edit.i + (+b.dataset.move);
    if (j < 0 || j >= s.plan.length) return;
    [s.plan[edit.i], s.plan[j]] = [s.plan[j], s.plan[edit.i]];
    edit.i = j; planned(); render();
  });
  const rm = form.querySelector("[data-remove]");
  if (rm) rm.onclick = () => {
    const k = s.plan[edit.i][0];
    if (!confirm(`Remove ${S.prog.ex[k].name} from ${s.name}?`)) return;
    s.plan.splice(edit.i, 1);
    edit = null; planned(); render();
  };
  const cancel = form.querySelector("[data-cancel]");
  if (cancel) cancel.onclick = () => { edit = null; render(); };
  form.querySelectorAll("[data-bump]").forEach(b => b.onclick = () => {
    const [f, d] = b.dataset.bump.split(":"), inp = get(f);
    inp.value = Math.max(1, Math.min(50, (+inp.value || 0) + +d));
  });
  form.querySelectorAll('[name="kind"]').forEach(r => r.onchange = () => {
    form.querySelector('[data-when="bar"]').hidden = r.value !== "bar";
  });
  /* Muscles are kept in the order picked, so the first stays the main one. A new exercise
     picks one from its name until any is chosen by hand. */
  const boxes = [...form.querySelectorAll('[name="group"]')];
  let chosen = edit.i >= 0 ? musclesOf(S.prog.ex[s.plan[edit.i][0]]).filter(m => MUSCLE[m]) : [];
  const showMain = () => boxes.forEach(b => b.parentElement.classList.toggle("main", b.value === chosen[0]));
  let groupTouched = chosen.length > 0;
  boxes.forEach(b => b.onchange = () => {
    groupTouched = true;
    chosen = b.checked ? [...chosen.filter(m => m !== b.value), b.value] : chosen.filter(m => m !== b.value);
    showMain();
  });
  get("name").oninput = () => {
    if (groupTouched) return;
    const g = guessGroup(get("name").value);
    chosen = MUSCLE[g] ? [g] : [];
    boxes.forEach(b => { b.checked = b.value === g; });
    showMain();
  };
  const src = get("src");
  if (src) src.onchange = () => {
    form.querySelectorAll("[data-newonly]").forEach(el => el.classList.toggle("hide", !!src.value));
    form.querySelector("[data-existonly]").hidden = !src.value;   /* the sharing note is about existing ones */
  };
  form.querySelector("[data-save]").onclick = () => {
    if (edit.i === -1 && src && src.value){
      s.plan.push([src.value, edit.n]);
      edit = null; planned("Added."); render(); return;
    }
    const pick = n => (form.querySelector(`[name="${n}"]:checked`) || {}).value;
    const name = get("name").value.trim(), lo = +get("lo").value, hi = +get("hi").value,
          inc = +get("inc").value, w = +get("w").value, rest = +get("rest").value,
          kind = pick("kind") || "machine",
          barKg = +(pick("barKg") || BARBELL),
          muscles = chosen.length ? chosen.slice() : [guessGroup(name)], group = muscles[0];
    if (!name){ toast("Give it a name."); return; }
    if (!(lo >= 1 && hi >= lo)){ toast("Rep range needs a low end and a high end."); return; }
    if (!(inc > 0)){ toast("Increment must be above zero."); return; }
    if (!(rest > 0)){ toast("Pick a rest time."); return; }
    if (!(w >= 0)){ toast("Weight can't be negative."); return; }
    if (edit.i >= 0){
      const k = s.plan[edit.i][0], e = S.prog.ex[k];
      Object.assign(e, {name, lo, hi, inc, kind, rest, group, barKg, muscles});
      if (S.weights[k] !== w){
        S.weights[k] = w;
        if (!hasHistory(k)) e.start = w;
        if (S.live) for (const x of S.live.log)
          if (x.k === k && x.reps.every(r => r === null)) x.weight = w;
      }
    } else {
      const k = newId(name);
      S.prog.ex[k] = {name, lo, hi, inc, start:w, kind, rest, group, barKg, muscles};
      S.weights[k] = w;
      s.plan.push([k, edit.n]);
    }
    edit = null; planned("Saved."); render();
  };
}

/* ── progress ──────────────────────────────────────────────────────────── */
/* Charts are inline SVG sized to the column, so text is never stretched. Each chart
   registers its points here; wireCharts turns them into a crosshair and tooltip. */
let charts = [];
const chartW = () => Math.max(240, Math.min(616, document.getElementById("view").clientWidth - 24 - 28));
const compact = n => n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k" : Math.round(n).toLocaleString();
const shortDate = s => new Date(s + "T12:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short"});
function niceStep(range, n){
  const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw) || 10 * mag;
}
/* Column path: square at the baseline, 4px rounded data end. */
function colPath(x, w, y, base){
  const r = Math.min(4, (base - y) / 2, w / 2);
  return `M${x} ${base}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${base}Z`;
}
function volumeChart(){
  const rs = S.history.slice(0, 12).reverse();
  const W = chartW(), H = 150, L = 36, R = 6, T = 16, B = 20, base = H - B;
  const vals = rs.map(tonnage), top = Math.max(...vals, 1);
  const step = niceStep(top, 2), yMax = Math.ceil(top / step) * step;
  const y = v => base - (v / yMax) * (base - T);
  const band = (W - L - R) / rs.length, cw = Math.min(24, band * 0.62);
  let g = "";
  for (let v = 0; v <= yMax + 1e-9; v += step)
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${compact(v)}</text>`;
  const xs = [], ys = [], tips = [];
  let cols = "", hits = "";
  rs.forEach((r, i) => {
    const cx = L + band * i + band / 2, v = vals[i];
    xs.push(cx); ys.push(y(v));
    tips.push([`${Math.round(v).toLocaleString()} kg`, `${sessName(r)} · ${fmtDate(r.date)}`]);
    cols += `<path class="col${i < rs.length - 1 ? " dim" : ""}" d="${colPath(cx - cw / 2, cw, y(v), base)}"/>`;
    hits += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${base - T}"/>`;
  });
  const last = rs.length - 1;
  const lab = `<text class="lbl" x="${xs[last]}" y="${ys[last] - 6}" text-anchor="${last === 0 ? "start" : "middle"}">${compact(vals[last])}</text>`;
  const xl = `<text class="ax" x="${xs[0]}" y="${H - 5}" text-anchor="${rs.length > 1 ? "start" : "middle"}">${shortDate(rs[0].date)}</text>`
    + (rs.length > 1 ? `<text class="ax" x="${xs[last]}" y="${H - 5}" text-anchor="end">${shortDate(rs[last].date)}</text>` : "");
  charts.push({xs, ys, tips, W, H, kind:"col"});
  return `<div class="chart" data-chart="${charts.length - 1}"><h2>Volume per session</h2>
    <div class="sub">Kilograms moved, last ${rs.length} session${rs.length === 1 ? "" : "s"}. Tap a column.</div>
    <svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Volume per session, latest ${Math.round(vals[last])} kg">
      ${g}${cols}${lab}${xl}${hits}</svg><div class="tip"></div></div>`;
}
function weightChart(k){
  const rows = S.history.filter(r => r.entries.some(x => x.k === k)).slice(0, 16).reverse()
    .map(r => ({date:r.date, x:r.entries.find(x => x.k === k)}));
  if (rows.length < 2) return `<p class="hint">Log it twice to see a trend here.</p>`;
  const W = chartW(), H = 140, L = 36, R = 44, T = 12, B = 20, base = H - B;
  const ws = rows.map(r => r.x.weight);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi - lo < 5){ lo -= 2.5; hi += 2.5; }
  const step = niceStep(hi - lo, 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => L + (W - L - R) * (rows.length === 1 ? .5 : i / (rows.length - 1));
  const y = v => base - (v - lo) / (hi - lo) * (base - T);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step)
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${kg(v)}</text>`;
  const xs = rows.map((_, i) => x(i)), ys = ws.map(y);
  const line = xs.map((px, i) => `${i ? "L" : "M"}${px.toFixed(1)} ${ys[i].toFixed(1)}`).join("");
  const area = `${line}L${xs[xs.length - 1]} ${base}L${xs[0]} ${base}Z`;
  const n = rows.length - 1;
  const tips = rows.map(r => [`${kg(r.x.weight)} kg`, `${fmtDate(r.date)} · ${r.x.reps.map(v => v ?? "–").join(" / ")}`]);
  charts.push({xs, ys, tips, W, H, kind:"line", T, base});
  return `<div class="chart" data-chart="${charts.length - 1}">
    <svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Working weight over ${rows.length} sessions, latest ${kg(ws[n])} kg">
      ${g}<path class="area" d="${area}"/><path class="ln" d="${line}"/>
      ${xs.map((px, i) => `<circle class="dot" cx="${px}" cy="${ys[i]}" r="${i === n ? 5 : 4}"/>`).join("")}
      <text class="lbl" x="${xs[n] + 9}" y="${ys[n] + 4}">${kg(ws[n])}</text>
      <text class="ax" x="${xs[0]}" y="${H - 5}" text-anchor="start">${shortDate(rows[0].date)}</text>
      <text class="ax" x="${xs[n]}" y="${H - 5}" text-anchor="end">${shortDate(rows[n].date)}</text>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${base}"/>
      <rect class="hit" x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}"/>
    </svg><div class="tip"></div></div>`;
}
function spark(k){
  const ws = S.history.slice(0, 8).reverse().map(r => (r.entries.find(x => x.k === k) || {}).weight)
    .filter(w => typeof w === "number");
  if (ws.length < 2) return "";
  const lo = Math.min(...ws), hi = Math.max(...ws), n = ws.length - 1;
  const pt = (w, i) => [2 + 54 * i / n, hi === lo ? 12 : 21 - 18 * (w - lo) / (hi - lo)];
  const d = ws.map((w, i) => (i ? "L" : "M") + pt(w, i).map(v => v.toFixed(1)).join(" ")).join("");
  const [ex, ey] = pt(ws[n], n);
  return `<svg class="spark" viewBox="0 0 58 24" aria-hidden="true"><path d="${d}"/><circle cx="${ex}" cy="${ey}" r="2.6"/></svg>`;
}
/* Consistency: one square per day, weeks as columns ending this week, darker for more
   volume. One hue, four steps by rank among the days trained, so the heaviest day is
   always the darkest even with few sessions; empty days stay ground. */
function consistency(){
  const W = chartW(), L = 16, cell = 14, gap = 3, step = cell + gap;
  const weeks = Math.max(8, Math.floor((W - L + gap) / step));
  const vol = {}, names = {};
  for (const r of S.history){
    vol[r.date] = (vol[r.date] || 0) + tonnage(r);
    (names[r.date] = names[r.date] || []).push(sessName(r));
  }
  const vs = [...new Set(Object.values(vol).filter(v => v > 0))].sort((a, b) => a - b);
  const level = v => !v ? 0 : vs.length < 2 ? 4 : 1 + Math.floor(3 * vs.indexOf(v) / (vs.length - 1));
  const today = todayISO(), mon = new Date(weekDates()[0] + "T12:00:00");
  const H = 7 * step - gap + 2;
  const xs = [], ys = [], tips = [];
  let cells = "", trained = 0, planned = 0;
  for (let w = 0; w < weeks; w++){
    for (let d = 0; d < 7; d++){
      const dt = new Date(mon); dt.setDate(mon.getDate() - (weeks - 1 - w) * 7 + d);
      const day = iso(dt);
      if (day > today) continue;
      const v = vol[day] || 0, lv = level(v), x = L + w * step, y = 1 + d * step;
      if (v) trained++;
      cells += `<rect class="${lv ? "l" + lv : "day"}${day === today ? " today" : ""}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3"/>`;
      xs.push(x + cell / 2); ys.push(y);
      tips.push(v ? [`${Math.round(v).toLocaleString()} kg`, `${names[day].join(" + ")} · ${fmtDate(day)}`]
                  : ["Rest", fmtDate(day)]);
    }
  }
  const ax = [[0, "M"], [2, "W"], [4, "F"]].map(([d, t]) =>
    `<text class="ax" x="0" y="${1 + d * step + cell - 3}">${t}</text>`).join("");
  charts.push({xs, ys, tips, W, H, kind:"cal", cell});
  const key = [0, 1, 2, 3, 4].map(l => `<svg viewBox="0 0 11 11" aria-hidden="true" class="cal key"><rect class="${l ? "l" + l : "day"}" width="11" height="11" rx="2.5"/></svg>`).join("");
  return `<div class="chart" data-chart="${charts.length - 1}"><h2>Consistency</h2>
    <div class="sub">${trained} training day${trained === 1 ? "" : "s"} in the last ${weeks} weeks. Each square is a day.</div>
    <svg class="cal" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${trained} training days in the last ${weeks} weeks">
      ${ax}${cells}</svg><div class="tip"></div>
    <div class="calkey">Less${key}More</div></div>`;
}
function statsRow(){
  const wk = weekDates()[0], thisWeek = S.history.filter(r => r.date >= wk);
  const vol = thisWeek.reduce((a, r) => a + tonnage(r), 0);
  const up = Object.keys(S.prog.ex).filter(k => usedIn(k).length && S.weights[k] > S.prog.ex[k].start).length;
  return `<div class="stats">
    <div class="stat"><span>Sessions</span><b>${S.history.length}</b></div>
    <div class="stat"><span>This week</span><b>${compact(vol)}<small>kg</small></b></div>
    <div class="stat"><span>Weights up</span><b>${up}</b></div></div>`;
}
function progressView(){

                : dup ? `<em>${musclesLabel(e)} · ${e.lo}–${e.hi} reps</em>` : `<em>${musclesLabel(e)}</em>`;
      h += `<button class="prow" data-px="${k}">${icon(e, "sm")}

          <span>${x.reps.map(n => n ?? "–").join(" / ")}</span></div>`;
      h += `<div class="acts"><button class="warn" data-delh="${i}">Delete this session</button></div></div>`;
    }

function exDetail(k){
  const rows = S.history.filter(r => r.entries.some(x => x.k === k)).slice(0, 6)
    .map(r => ({date:r.date, x:r.entries.find(x => x.k === k)}));
  if (!rows.length) return `<div class="detail"><p class="hint">Not logged yet.</p></div>`;
  let h = `<div class="detail">${weightChart(k)}`;
  for (const {date, x} of rows)
    h += `<div class="drow"><span>${fmtDate(date)}</span><b>${kg(x.weight)} kg</b>
      <span>${x.reps.map(n => n ?? "–").join(" / ")}</span></div>`;
  if (stalled(k)){
    const e = S.prog.ex[k], drop = Math.round(S.weights[k] * 0.9 / e.inc) * e.inc;
    h += `<p class="hint">Three sessions at this weight with no rep improvement.
      Try dropping to about ${kg(drop)} kg and building back up.</p>`;
  }
  return h + `</div>`;
}
function stalled(k){
  const rows = S.history.filter(r => r.entries.some(x => x.k === k)).slice(0, 3)
    .map(r => r.entries.find(x => x.k === k));
  if (rows.length < 3) return false;
  const sum = x => x.reps.reduce((a, n) => a + (n || 0), 0);
  return rows.every(x => x.weight === rows[0].weight) && S.weights[k] === rows[0].weight
      && sum(rows[0]) <= sum(rows[2]);
}

/* One tooltip per chart: the crosshair finds the nearest point by x; columns lift. */
let pinned = [];
document.addEventListener("pointerdown", ev => pinned.forEach(f => f(ev)), true);
function wireCharts(){
  pinned = [];
  document.querySelectorAll("[data-chart]").forEach(box => {
    const c = charts[+box.dataset.chart], svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const xh = svg.querySelector(".xh"), cols = svg.querySelectorAll(".col");
    const cells = c.kind === "cal" ? svg.querySelectorAll("rect") : [];
    let cur = -1;
    const show = i => {
      cur = i;
      const r = svg.getBoundingClientRect(), br = box.getBoundingClientRect(), sx = r.width / c.W, sy = r.height / c.H;
      tip.textContent = "";
      const b = document.createElement("b"); b.textContent = c.tips[i][0];
      tip.append(b, document.createTextNode(c.tips[i][1]));
      tip.classList.add("on");
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const px = r.left - br.left + c.xs[i] * sx, py = r.top - br.top + c.ys[i] * sy;
      tip.style.left = Math.max(4, Math.min(br.width - tw - 4, px - tw / 2)) + "px";
      tip.style.top = Math.max(2, py - th - 10) + "px";
      if (xh){ xh.setAttribute("x1", c.xs[i]); xh.setAttribute("x2", c.xs[i]); xh.classList.add("on"); }
      cols.forEach((el, j) => el.classList.toggle("dim", j !== i));
      cells.forEach((el, j) => el.classList.toggle("on", j === i));
    };
    const hide = () => {
      cur = -1; tip.classList.remove("on");
      if (xh) xh.classList.remove("on");
      cols.forEach((el, j) => el.classList.toggle("dim", j !== cols.length - 1));
      cells.forEach(el => el.classList.remove("on"));
    };
    const near = ev => {
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * c.W / r.width;
      let best = 0;
      if (c.kind === "cal"){
        const y = (ev.clientY - r.top) * c.H / r.height - c.cell / 2;
        const d = i => (c.xs[i] - x) ** 2 + (c.ys[i] - y) ** 2;
        c.xs.forEach((_, i) => { if (d(i) < d(best)) best = i; });
        return best;
      }
      c.xs.forEach((px, i) => { if (Math.abs(px - x) < Math.abs(c.xs[best] - x)) best = i; });
      return best;
    };
    /* A mouse shows values as it moves and hides them on leaving. A finger pins the
       value where it lands; it stays until a tap somewhere outside this chart. */
    svg.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse" || ev.buttons) show(near(ev)); });
    svg.addEventListener("pointerdown", ev => show(near(ev)));
    svg.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") hide(); });
    svg.addEventListener("focus", () => { if (cur < 0) show(c.xs.length - 1); });
    pinned.push(ev => { if (!svg.contains(ev.target)) hide(); });
    svg.addEventListener("keydown", ev => {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight"){
        ev.preventDefault();
        show(Math.max(0, Math.min(c.xs.length - 1, (cur < 0 ? c.xs.length - 1 : cur) + (ev.key === "ArrowLeft" ? -1 : 1))));
      }
    });
  });
}

      + (back.length ? ` The weight it raised on ${listJoin(back.map(exName))} goes back down.` : "");
    if (!confirm(msg)) return;

    toast(back.length ? "Deleted, weights put back." : "Session deleted."); render();
  });
}
/* Entries in history[i] whose top-of-range result raised a weight that is still the
   current one, and where no later session has logged that exercise since. */
function raisedBy(i){
  const r = S.history[i];
  return r.entries.filter(x => {
    const e = S.prog.ex[x.k];
    if (!e || !hitTop(x)) return false;
    const latest = S.history.findIndex(h => h.entries.some(y => y.k === x.k)) === i;
    return latest && Math.abs(S.weights[x.k] - (x.weight + e.inc)) < 1e-9;
  });
}

function restoreText(t){

}

  };
  document.getElementById("wipe").onclick = () => {
    if (confirm("Erase every session, reset the programme and all weights? This cannot be undone.")){
      S = blank(); save(); toast("Everything reset."); go("train");
    }
  };
}

function dl(name, text, type){
  const b = new Blob([text], {type});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}

if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(() => {});

render();
</script>
