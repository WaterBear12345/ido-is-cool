<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Barload</title>
<meta name="description" content="Workout planner and training log. Double progression, plate maths, editable programme. Static, offline, no accounts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barload">
<meta name="theme-color" content="#101418">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ground:#e6e8eb; --panel:#ffffff; --ink:#101418; --steel:#69727d; --hair:#cdd2d8;
  --head:#101418; --head-sub:#9aa4af; --field:#f2f4f6;
  --done:#f2f8f4; --hit:#dcefe3; --inrange:#dbe6f5; --spark:#c3ccd6; --navbg:rgba(255,255,255,.94);
  --p25:#c8102e; --p20:#0057b8; --p15:#ffd100; --p10:#009639; --p5:#f2f4f6; --p2:#8a929b;
  --ok:#00743a; --bar:#8a929b; --accent:#0057b8; --zone:#b3cbeb; --wash:rgba(0,87,184,.10);
  /* muscle groups, fixed order chest back legs arms shoulders core; validated for CVD and contrast */
  --g-chest:#c8102e; --g-back:#0057b8; --g-legs:#009639; --g-arms:#8a4fd8; --g-shoulders:#b98000;
  --g-core:#0094a8; --g-other:#69727d;
  --go:#0a7f3f; --go2:#12a352; --fig:#c3cad3;
  --pad-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#12161a; --panel:#1c2127; --ink:#eef1f4; --steel:#98a2ad; --hair:#2d343c;
    --head:#0b0e11; --head-sub:#8a949f; --field:#12161a;
    --done:#1b2a22; --hit:#1f3a2b; --inrange:#1e2f47; --spark:#3a434d; --navbg:rgba(28,33,39,.94);
    --ok:#4cc27e; --p5:#e6e8eb; --accent:#4d8fe0; --zone:#2c4f80; --wash:rgba(77,143,224,.14);
    --g-chest:#e84a5c; --g-back:#4a8ade; --g-legs:#2aa358; --g-arms:#976fe3; --g-shoulders:#b8871f;
    --g-core:#189db0; --g-other:#98a2ad; --fig:#4a5561;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;      /* dvh keeps it honest as iOS chrome moves */
  display:flex; flex-direction:column;
  overscroll-behavior-y:none;               /* no rubber-band that drags the bar off the edge */
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.hide,[hidden]{display:none !important}
.primary{background:var(--ink) !important;color:var(--ground) !important}

/* ── header ───────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:var(--head);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
header .sub{margin-top:2px;font-size:13px;color:var(--head-sub)}

main{flex:1 0 auto;width:100%;padding:14px 12px 24px;max-width:640px;margin:0 auto}
main > *{scroll-margin-top:84px;scroll-margin-bottom:150px}

/* ── week strip ───────────────────────────────────────── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.week button{background:var(--panel);border-radius:11px;padding:9px 2px 8px;min-width:0;
             display:flex;flex-direction:column;align-items:center;gap:4px}
.week button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.week button.rest{opacity:.55}
.week button[disabled]{cursor:default}
.week .d{font-size:10.5px;font-weight:600;color:var(--steel);white-space:nowrap}
.week .s{font-size:12.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.week .dot{width:8px;height:8px;border-radius:50%;background:var(--hair);display:block}
.week .dot.done{background:var(--ok)}
.week .dot.up{background:var(--accent)}
.week .dot.miss{background:var(--p25);opacity:.55}

/* ── exercise row (live) ──────────────────────────────── */
.ex{background:var(--panel);border-radius:14px;margin-bottom:10px;overflow:hidden;
    box-shadow:0 1px 0 var(--hair)}
.ex.done{background:var(--done)}
.ex-head{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}

/* ── exercise icon: equipment glyph, tinted by muscle group ── */
/* one pill, two glyphs: equipment in ink, then the muscle group in its colour */
.ico{height:40px;padding:0 8px;border-radius:12px;flex:none;display:flex;align-items:center;gap:5px;position:relative}
.ico::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.13}
.ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;
         stroke-linecap:round;stroke-linejoin:round;position:relative}
.ico .eq{color:var(--ink);opacity:.72}
.ico i{width:1px;align-self:stretch;margin:9px 0;background:currentColor;opacity:.3;position:relative}
.ico.sm{height:34px;padding:0 6px;border-radius:10px;gap:4px}
.ico.sm svg{width:19px;height:19px}
.ico.sm i{margin:8px 0}
/* body figures: neutral parts with hairline gaps, the targeted muscle in its group colour */
.fp{fill:var(--fig);stroke:var(--panel);stroke-width:.9;stroke-linejoin:round}
svg .fp.hot{fill:currentColor}
.ico svg.fig + svg.fig{margin-left:-3px}
.mpick label.main::after{content:"Main";position:absolute;top:4px;right:4px;font-size:9px;font-weight:800;
     letter-spacing:.02em;color:var(--ground);background:var(--ink);padding:1px 4px;border-radius:5px}
.ico svg.fig{width:auto;height:40px}
.ico.sm svg.fig{height:34px}
.mpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.f .mpick label{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;margin:0;
     padding:7px 2px 6px;border-radius:11px;background:var(--panel);border:1px solid var(--hair);
     font-size:11px;font-weight:600;color:var(--ink);line-height:1.15;text-align:center}
.mpick svg{height:58px;width:auto}
.mpick label:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink);border-color:var(--ink)}
.mpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.ex-name{flex:1;min-width:0}
.ex-name b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.ex-name span{display:block;font-size:13px;color:var(--steel);margin-top:1px}
.ex-kg{font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.ex-kg small{font-size:12px;font-weight:500;color:var(--steel);margin-left:2px}
.tick{width:22px;height:22px;flex:none;border-radius:50%;background:var(--ok);
      display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}

.body{padding:2px 16px 18px;border-top:1px solid var(--hair)}
.hero{display:flex;align-items:flex-end;gap:14px;padding:18px 0 4px}
.hero .kg{font-size:68px;font-weight:800;letter-spacing:-.045em;line-height:.86}
.hero .unit{font-size:19px;font-weight:600;color:var(--steel);padding-bottom:9px}
.hero .adj{margin-left:auto;display:flex;gap:8px;padding-bottom:6px}
.adj button{width:42px;height:42px;border-radius:11px;background:var(--ground);
            font-size:21px;font-weight:600;display:grid;place-items:center}
.adj button:active{background:var(--hair)}
.reprange{font-size:14px;color:var(--steel);margin:4px 0 0;display:flex;align-items:center;gap:10px}
.reprange span{flex:1;min-width:0}
.reprange b{color:var(--ink);font-weight:700}
.link{font-size:13px;font-weight:600;color:var(--accent);padding:4px 0}
.rredit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding:10px;border-radius:12px;background:var(--field)}
.rredit label{display:block;font-size:11.5px;font-weight:600;color:var(--steel);margin-bottom:4px}
.rredit .stp button{background:var(--panel)}
.rredit .hint{grid-column:1/-1;margin:0}

.viz{margin:14px 0 0}
.viz svg{display:block;width:100%;height:auto}
.viz .shaft{fill:var(--bar)}
.viz .collar{fill:var(--steel)}
.viz .pl8{stroke:rgba(0,0,0,.22);stroke-width:1}
.viz .iron{fill:var(--ink)}
.viz .ironlbl{fill:var(--panel);font-size:15px;font-weight:800;text-anchor:middle}
.viz .slab{fill:var(--hair)}
.viz .slab.up{fill:var(--accent)}
.viz .rail{stroke:var(--hair);stroke-width:2.5;stroke-linecap:round}
.viz .rope{fill:none;stroke:var(--steel);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.viz .pin{fill:var(--ink)}
.platechips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--steel)}
.pc{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:99px;
    background:var(--ground);color:var(--ink);font-weight:700;font-size:12.5px}
.pc i{width:10px;height:10px;border-radius:3px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.barkg{margin-left:auto;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--hair);
       font-size:12.5px;font-weight:600;color:var(--steel)}
.nobar{font-size:13px;color:var(--steel);margin:14px 0 0}

.sets{display:flex;gap:8px;margin-top:16px}
.set{flex:1;height:62px;border-radius:12px;background:var(--ground);
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.set b{font-size:23px;font-weight:700;line-height:1}
.set span{font-size:11px;color:var(--steel)}
.set.empty b{color:var(--hair);font-weight:600}
.set.hit{background:var(--hit)}
.set.hit b{color:var(--ok)}
.set:active{transform:scale(.97)}

.note{margin-top:14px;font-size:13.5px;color:var(--steel)}
.note.up{color:var(--ok);font-weight:600}

/* ── rep pad ──────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(16,20,24,.42);z-index:40;opacity:0;
       pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);
     border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--pad-b));
     transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
     max-width:640px;margin:0 auto}
.pad.on{transform:none}
.padhead{display:flex;align-items:flex-start;gap:12px}
.padhead div{flex:1;min-width:0}
.pad h3{margin:0 0 2px;font-size:16px;font-weight:600}
.pad p{margin:0;font-size:13.5px;color:var(--steel)}
#padClose{width:34px;height:34px;border-radius:50%;background:var(--ground);font-size:15px;flex:none;color:var(--steel)}
.big{font-size:88px;font-weight:800;letter-spacing:-.05em;line-height:1;text-align:center;margin:14px 0 2px;
     font-variant-numeric:proportional-nums}
.zone{text-align:center;font-size:13.5px;font-weight:600;color:var(--steel);min-height:19px}
.zone.in{color:var(--accent)}
.zone.top{color:var(--ok)}
.slide{display:flex;align-items:flex-start;gap:10px;margin:18px 0 6px}
.slide > button{width:44px;height:44px;border-radius:12px;background:var(--ground);font-size:22px;font-weight:600;flex:none;margin-top:-8px}
.rng{flex:1;position:relative;height:44px}
.rng input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;display:block}
.rng input::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--track)}
.rng input::-moz-range-track{height:10px;border-radius:5px;background:var(--track)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--panel);
     border:3px solid var(--ink);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rng input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--panel);border:3px solid var(--ink)}
.rng .tk{position:absolute;top:30px;font-size:11px;font-weight:600;color:var(--steel);transform:translateX(-50%)}
/* Rep ruler, after the iOS timer dial: a dark strip of ticks that scrolls under a fixed
   pointer and snaps to whole reps; ticks up to the value are lit, the rest dimmed, and a
   green bar under the ticks marks the target range. */
.ruler{position:relative;margin:16px 0 8px;padding:14px 0 26px;border-radius:20px;background:#0b0e11;overflow:hidden;
       --lit:#5b9cf0;--dim:rgba(91,156,240,.26);--dimtxt:rgba(91,156,240,.4)}
.rtrack{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
        overscroll-behavior-x:contain;touch-action:pan-x;
        -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24%,#000 76%,transparent 100%);
                mask-image:linear-gradient(90deg,transparent 0,#000 24%,#000 76%,transparent 100%)}
.rtrack::-webkit-scrollbar{display:none}
.rpad{flex:0 0 calc(50% - 12px)}
.rt{flex:0 0 24px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;
    padding-bottom:12px}
.rt b{height:18px;font-size:16px;font-weight:800;line-height:18px;color:var(--dimtxt);font-variant-numeric:tabular-nums}
.rt i{display:block;width:3.5px;height:46px;border-radius:2px;background:var(--dim)}
.rt.lit i{background:var(--lit)}
.rt.lit b{color:var(--lit)}
.rt.z::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:4px;background:rgba(76,194,126,.75)}
.rt.zs::after{left:9px;border-radius:2px 0 0 2px}
.rt.ze::after{right:9px;border-radius:0 2px 2px 0}
.rpin{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:0;height:0;
      border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--lit)}
/* segmented controls outside the Plan form: each option anchors its own invisible input */
.card .seg label{position:relative;flex:1;text-align:center;margin:0;padding:9px 4px;border-radius:8px;
     font-size:13.5px;font-weight:600;color:var(--steel)}
.haprow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.card .haprow button{margin:0}
.hapd{position:relative;display:block}
.hapd input{position:absolute;inset:0;width:100%;height:100%;opacity:.011;margin:0;cursor:pointer}
.hapstrip{margin-top:10px;height:52px;border-radius:12px;background:#0b0e11;color:#5b9cf0;font-size:13.5px;font-weight:600;
          display:grid;place-items:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;
          background-image:repeating-linear-gradient(90deg,rgba(91,156,240,.35) 0 2px,transparent 2px 24px)}
.sr{position:absolute !important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}
.padfoot{display:flex;gap:8px;margin-top:8px}
.padfoot button{flex:1;height:50px;border-radius:13px;background:var(--ground);font-size:15.5px;font-weight:600}
.padfoot button.primary{flex:2}

/* ── finish bar ───────────────────────────────────────── */
.finish{margin:18px 2px 0}
.finish button{width:100%;height:54px;border-radius:14px;background:var(--ink);color:var(--ground);
               font-size:16px;font-weight:600}
.finish button[disabled]{background:var(--hair);color:var(--steel)}

/* ── tabs ─────────────────────────────────────────────── */
nav{position:sticky;bottom:0;z-index:30;display:flex;flex-direction:column;
    background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--hair);padding-bottom:var(--pad-b)}
.tabs{display:flex}
.tabs button{flex:1;padding:10px 4px 11px;font-size:11.5px;font-weight:600;color:var(--steel);
           display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--ink)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
        stroke-linecap:round;stroke-linejoin:round}

/* ── rest timer, docked above the tabs ────────────────── */
.timer{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair);
       width:100%;max-width:640px;margin:0 auto}
.timer .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.timer .tt b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;min-width:66px}
.timer .tt span{font-size:12.5px;color:var(--steel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{height:36px;padding:0 11px;border-radius:9px;background:var(--ground);font-size:13px;font-weight:600;flex:none}
.timer.over{background:var(--hit)}
.timer.over .tt b{color:var(--ok)}

.go{position:fixed;inset:0;z-index:70;background:var(--go);color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;
    padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);
    animation:gopulse .9s ease-in-out 4}
.go b{font-size:112px;font-weight:900;letter-spacing:-.05em;line-height:.9}
.go p{margin:0;font-size:18px;font-weight:600}
.go small{font-size:14px;opacity:.85}
.goacts{display:flex;gap:10px;margin-top:26px}
.goacts button{height:50px;padding:0 22px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;
               font-weight:700;font-size:16px}
.goacts button.solid{background:#fff;color:#075c2e}
@keyframes gopulse{0%,100%{background:var(--go)}50%{background:var(--go2)}}

.setctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.setctl span{flex:1;text-align:center;font-size:12.5px;color:var(--steel)}
.setctl button{height:34px;padding:0 12px;border-radius:9px;background:var(--ground);font-size:13px;font-weight:600;flex:none}
.setctl button[disabled]{opacity:.35}

/* ── shared bits ──────────────────────────────────────── */
.grp{margin:20px 2px 8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.grp i{width:22px;height:4px;border-radius:2px;display:block;font-style:normal}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:16px;font-weight:600}
.card p{margin:0 0 10px;font-size:14px;color:var(--steel);line-height:1.5}
.card p:last-child{margin-bottom:0}
.card.nag{box-shadow:inset 3px 0 0 var(--accent)}
.card.alert{box-shadow:inset 3px 0 0 var(--p25)}
.card.alert h2{color:var(--p25)}
.card button{height:46px;width:100%;border-radius:11px;background:var(--ground);
             font-size:15px;font-weight:600;margin-top:6px}
.card button.warn{color:var(--p25)}
.card input[type=date]{width:100%;height:44px;border-radius:10px;border:1px solid var(--hair);
     background:var(--field);padding:0 12px;font-size:16px;margin-top:4px}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 0 2px;font-size:14.5px;font-weight:500;line-height:1.35}
.tgl input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.hint{font-size:12.5px;color:var(--steel);margin:10px 0 0;line-height:1.45}
.empty{text-align:center;color:var(--steel);padding:56px 24px;font-size:15px;line-height:1.55}

.hist{background:var(--panel);border-radius:12px;padding:13px 15px;margin-bottom:8px;
      display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.hist b{flex:1;font-size:15px;font-weight:600}
.hist span{font-size:13px;color:var(--steel);white-space:nowrap}
.hist .chev{color:var(--hair);font-size:20px;line-height:1;margin-left:-2px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.pick button{background:var(--panel);border-radius:13px;padding:15px 13px;text-align:left}
.pick button b{display:block;font-size:15.5px;font-weight:600}
.pick button span{display:block;font-size:12.5px;color:var(--steel);margin-top:2px}
.pick .gdots{display:flex;gap:4px;margin-top:9px}
.pick .gdots i{width:8px;height:8px;border-radius:50%;display:block}

/* ── progress ─────────────────────────────────────────── */
.prow{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:7px;
      display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.prow .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.prow .nm em{display:block;font-style:normal;font-size:12.5px;color:var(--steel);margin-top:1px}
.prow .val{text-align:right;flex:none}

<script>
"use strict";
const KEY = "barload.v2", OLDKEY = "barload.v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const BARBELL = 20;
/* IWF plate colours, heaviest first: [kg, colour, drawn height] */

const MUSCLE = {
  chest:{n:"Chest", r:"chest", v:"front"},
  lats:{n:"Lats", r:"back", v:"back"}, upperback:{n:"Upper back", r:"back", v:"back"},
  lowerback:{n:"Lower back", r:"back", v:"back"},
  quads:{n:"Quads", r:"legs", v:"front"}, adductors:{n:"Adductors", r:"legs", v:"front"},
  glutes:{n:"Glutes", r:"legs", v:"back"}, hamstrings:{n:"Hamstrings", r:"legs", v:"back"},
  calves:{n:"Calves", r:"legs", v:"back"},
  biceps:{n:"Biceps", r:"arms", v:"front"}, triceps:{n:"Triceps", r:"arms", v:"back"},
  shoulders:{n:"Shoulders", r:"shoulders", v:"front"}, reardelts:{n:"Rear delts", r:"shoulders", v:"back"},

  ["obliques",/twist|russian|oblique|wood.?chop|side bend/i],
  ["calves",/calf|calves/i],
  ["hamstrings",/leg curl|hamstring|rdl|romanian|good.?morning|nordic/i],
  ["glutes",/glute|hip thrust|bridge/i],
  ["adductors",/adduct/i],
  ["lowerback",/back extension|hyperextension|deadlift|superman/i],
  ["quads",/squat|leg press|lunge|leg extension|quad|step.?up|split|hack/i],
  ["triceps",/tricep|push.?down|skull|\bdips?\b|overhead ext|french press|close.?grip|kickback/i],
  ["biceps",/curl|bicep/i],
  ["reardelts",/face pull|rear delt|reverse fl(y|ies)|reverse pec/i],
  ["shoulders",/shoulder|lateral|lat raise|overhead press|ohp|arnold|upright|front raise|military/i],
  ["lats",/pull.?down|pull.?up|\blats?\b|chin|pullover/i],
  ["upperback",/row|shrug|rhomboid|trap|back/i],

/* Equipment glyphs, 24px grid. */
const ICONS = {
  bar:'<path d="M1.5 12h21"/><path d="M5 8.5v7M8 6v12M16 6v12M19 8.5v7"/>',
  db:'<g transform="rotate(-45 12 12)"><path d="M8.5 12h7"/><path d="M5 9v6M8.2 7v10M15.8 7v10M19 9v6"/></g>',
  machine:'<path d="M12 1.5V5"/><rect x="5" y="5" width="14" height="4" rx="1.2"/><rect x="5" y="10.5" width="14" height="4" rx="1.2"/><rect x="5" y="16" width="14" height="4" rx="1.2"/><path d="M19 12.5h2.5"/>',

const HEAD = 'M30 1.5c4.3 0 6.8 3.3 6.8 7.6S34.3 17 30 17s-6.8-3.6-6.8-7.9S25.7 1.5 30 1.5z';
const ARM_LOW = [["forearms",'M12.6 46.4c1.5.8 3.5.8 4.8-.1l-2.3 14.9c-1.1.6-2.5.6-3.6-.1-.6-5-.2-9.9 1.1-14.7z'],
  ["hand",'M11.3 62.2c1.3.6 2.6.6 3.7 0l.2 4.2c-.5 1.4-3.6 1.5-4.2.1z']];
const KNEE = ["knee",'M21 88.9c1.5 1.4 3.6 1.2 4.8-.6l.2 3.4c-1.5 1.1-3.5 1.1-5-.1z'];
const FOOT = ["foot",'M22.2 114.3h2.8l.6 5.3c-1.2 1-3.8 1-5.6.1z'];

const FIG = {
  front:[["head",HEAD],["neck",'M26.6 15.5h6.8l.8 5.2h-8.4z'],
    ["shoulders",'M22.4 20.6c-4.7-.4-8.6 2.4-9.3 7.5l.4 5.2c1.7-2.6 4.3-4.6 7.3-5.6l1.6-7.1z'],
    ["chest",'M23.3 20.7H29.6v12.2c-2.9 1.9-6.5 1.8-8.6-.1-1.3-1.2-1.2-3.6-.8-6.1.4-2.4 1.5-4.6 3.1-6z'],
    ["biceps",UPPER_ARM], ...ARM_LOW,

    ["abs",'M25.8 35.3h3.8v20.9h-3.9z'],
    ["hips",'M20.5 53.4l4.9 3.2h4.2v8.8l-5.1-1.5-4.4-3.9c-.1-2.2.1-4.4.4-6.6z'],
    ["quads",'M20 60.9l4.4 3.6.9 22.9c-1.1 2.1-3.4 2.4-4.8.8-1.7-9.1-2.1-18.2-.5-27.3z'],
    ["adductors",'M25 64.5l4.6 1.4v12.2c-.9 3.4-1.9 6.4-3 9.2l-.7-.1z'],
    KNEE, ["shins",'M21 92.3c1.6 1 3.5 1 5 .1.3 7.1-.1 14.2-1.2 21.2h-2.6c-1.4-7.1-1.8-14.2-1.2-21.3z'], FOOT],
  back:[["head",HEAD],
    ["upperback",'M26.6 15.8h3.4v19.6l-3.7-2.3-5.1-10.5c1.9-1 3.7-2.9 5.4-6.8z'],
    ["reardelts",'M21.4 22.3c-3.8-1.7-7.6.6-8.3 5.8l.4 5.2c1.7-2.6 4.3-4.6 7.3-5.6l.6-5.4z'],
    ["lats",'M21.9 23.6l4.3 9.8 3.8 2.4v11.2l-5.8 2.9c-2.2-4-3.2-8.2-3.5-12.6-.2-4.7.2-9.3 1.2-13.7z'],
    ["triceps",UPPER_ARM], ...ARM_LOW,
    ["lowerback",'M24.4 50.8l5.6-2.8v8.6h-6.7c-.2-2 .2-4 1.1-5.8z'],
    ["glutes",'M20.6 57.1H30v9.6c-2.6 1.7-6.5 1.9-9.2.2-1-3.3-1.1-6.5-.2-9.8z'],
    ["hamstrings",'M20.4 68.3c3 1.4 6.6 1.3 9.4-.2l-2.6 19.2c-1.5 2.1-4.6 2.2-6.1.2-1.3-6.4-1.6-12.8-.7-19.2z'],
    KNEE, ["calves",'M21 92.3c1.6 1 3.5 1 5 .1 1.2 4.1 1.3 8.4.1 12.6l-1.3 8.6h-2.6c-2.3-6.9-2.8-14-1.2-21.3z'], FOOT]
};
const CENTRE = new Set(["head", "neck"]);
const LOWER = new Set(["quads", "adductors", "glutes", "hamstrings", "calves"]);
/* crop: small icons show just the half of the body that matters, so the muscle is legible. */
function figure(ms, crop){
  ms = [].concat(ms);
  const known = ms.filter(m => MUSCLE[m]);
  const views = known.length ? ["front", "back"].filter(v => known.some(m => MUSCLE[m].v === v)) : ["front"];
  /* crop to one half only when every muscle lives in it */
  const box = !crop || !known.length ? "8 0 44 121"
    : known.every(m => LOWER.has(m)) ? "8 52 44 69"
    : known.every(m => !LOWER.has(m)) ? "8 0 44 64" : "8 0 44 121";
  return views.map(v => {
    let h = "";
    for (const [part, d] of FIG[v]){
      const hot = known.includes(part), c = hot ? "fp hot" : "fp", st = hot ? ` style="color:${gcol(part)}"` : "";
      h += `<path class="${c}"${st} d="${d}"/>`;

  `<span class="ico ${cls}" style="color:${gcol(e.group)}" role="img" aria-label="${KIND_NAME[e.kind] || "Machine"}, ${musclesOf(e).map(muscleName).join(", ")}">`
  + `<svg class="eq" viewBox="0 0 24 24">${ICONS[e.kind] || ICONS.machine}</svg><i></i>${figure(musclesOf(e), true)}</span>`;

/* ── default programme, starting weights as of 6 Sep 2026 ──────────────
   kind: "bar" = barbell with plate maths on a barKg bar, "db" = dumbbells (per
   hand), "machine" = pin-loaded machine, "cable" = cable stack. Two sessions that reference the same key
   share one weight — that is how linking works. Unlinked repeats use
   distinct keys (tripushA/B, legcurlA/B, calfA/B, squat/squatback). */
const DEFAULT_EX = {
  bench:      {name:"Bench press",         lo:6,  hi:8,  inc:2.5, start:60,   kind:"bar"},
  pulldown:   {name:"Lat pulldowns",       lo:8,  hi:10, inc:2.5, start:60,   kind:"machine"},

  ohp:        {name:"Shoulder press",      lo:8,  hi:10, inc:2,   start:18,   kind:"db"},
  tripushA:   {name:"Tricep pushdowns",    lo:10, hi:12, inc:2.5, start:25,   kind:"machine"},

  squat:      {name:"Squats",              lo:5,  hi:8,  inc:5,   start:105,  kind:"bar"},
  rdl:        {name:"RDL",                 lo:8,  hi:10, inc:5,   start:85,   kind:"bar"},
  legcurlA:   {name:"Prone leg curls",     lo:10, hi:12, inc:2.5, start:32.5, kind:"machine"},
  calfA:      {name:"Calf raises",         lo:10, hi:12, inc:5,   start:160,  kind:"machine"},
  crunch:     {name:"Cable crunches",      lo:12, hi:15, inc:2.5, start:40,   kind:"machine"},

  incline:    {name:"Incline chest press", lo:8,  hi:10, inc:2.5, start:50,   kind:"machine"},
  flies:      {name:"Chest flies",         lo:10, hi:12, inc:2.5, start:70,   kind:"machine"},
  facepull:   {name:"Face pulls",          lo:12, hi:15, inc:2.5, start:15,   kind:"machine"},
  latraise:   {name:"Lat raises",          lo:12, hi:15, inc:2,   start:10,   kind:"db"},
  tripushB:   {name:"Tricep pushdowns",    lo:12, hi:15, inc:2.5, start:25,   kind:"machine"},
  hammer:     {name:"Hammer curls",        lo:10, hi:12, inc:2,   start:14,   kind:"db"},

  splitsquat: {name:"Split squats",        lo:8,  hi:10, inc:2,   start:28,   kind:"db"},
  squatback:  {name:"Squats, back-off",    lo:8,  hi:10, inc:2.5, start:80,   kind:"bar"},
  legcurlB:   {name:"Prone leg curls",     lo:12, hi:15, inc:2.5, start:32.5, kind:"machine"},
  hipadd:     {name:"Hip adduction",       lo:12, hi:15, inc:2.5, start:30,   kind:"machine"},
  calfB:      {name:"Calf raises",         lo:12, hi:15, inc:5,   start:160,  kind:"machine"}
};
/* Rest between sets, in seconds. Compounds get longer; anything not listed is an isolation. */
const DEFAULT_REST = {squat:180, rdl:150, bench:150, squatback:120, splitsquat:120, incline:120,
                      pulldown:90, lowrow:90, ohp:90, crunch:60};
const DEFAULT_GROUP = {bench:"chest", incline:"chest", flies:"chest", pulldown:"lats", lowrow:"upperback",
  ohp:"shoulders", latraise:"shoulders", facepull:"reardelts", tripushA:"triceps", tripushB:"triceps",
  preacher:"biceps", hammer:"biceps", crunch:"abs", squat:"quads", squatback:"quads", splitsquat:"quads",
  rdl:"hamstrings", legcurlA:"hamstrings", legcurlB:"hamstrings", calfA:"calves", calfB:"calves", hipadd:"adductors"};
const CABLE = ["pulldown", "lowrow", "facepull", "tripushA", "tripushB", "crunch"];
const DEFAULT_BAR = {squat:25, squatback:25};      /* the squat rack's bar is 25 kg */
for (const k in DEFAULT_EX){
  const e = DEFAULT_EX[k];
  e.rest = DEFAULT_REST[k] || 75;
  e.group = DEFAULT_GROUP[k];
  e.muscles = [e.group];
  e.barKg = DEFAULT_BAR[k] || BARBELL;
  if (CABLE.includes(k)) e.kind = "cable";
}
const REST_OPTS = [45, 60, 75, 90, 120, 150, 180, 240, 300];
/* day: 0 = Monday … 6 = Sunday, null = unscheduled. plan: [exerciseKey, sets] */
const DEFAULT_SESSIONS = {
  lowerA:{name:"Lower A", day:0, plan:[["squat",3],["rdl",3],["legcurlA",2],["calfA",2],["crunch",2]]},
  upperA:{name:"Upper A", day:1, plan:[["bench",3],["pulldown",3],["lowrow",2],["ohp",2],["tripushA",2],["preacher",2]]},
  lowerB:{name:"Lower B", day:3, plan:[["splitsquat",3],["squatback",2],["legcurlB",2],["hipadd",2],["calfB",2],["crunch",2]]},
  upperB:{name:"Upper B", day:5, plan:[["incline",3],["lowrow",3],["flies",2],["facepull",2],["latraise",2],["tripushB",2],["hammer",2]]}
};
const DEFAULT_ORDER = ["lowerA","upperA","lowerB","upperB"];
const DEFAULT_START = "2026-09-07";
const defaultProg = () => JSON.parse(JSON.stringify({ex:DEFAULT_EX, sessions:DEFAULT_SESSIONS, order:DEFAULT_ORDER}));

/* ── state ─────────────────────────────────────────────────────────────── */
/* Everything lives in localStorage under KEY, on this device only. There is no
   server: a static page can be served by GitHub Pages but never written to. A
   dated backup file after each session is what makes the log outlive the phone. */
let S;
const DEFAULTS = () => ({autosave:true, sound:true, haptics:true, hapticMode:"faint", startDate:DEFAULT_START, lastBackupAt:null, lastBackupCount:0, muscles:2});
function blank(){
  const prog = defaultProg(), w = {};
  for (const k in prog.ex) w[k] = prog.ex[k].start;
  return {v:2, prog, weights:w, history:[], live:null, settings:DEFAULTS()};
}
/* Accepts a v1 or v2 object, returns a clean v2 object, or null if it is not a Barload backup. */
function migrate(o){
  if (!o || typeof o !== "object" || !o.weights || typeof o.weights !== "object") return null;
  let n;
  if (o.v === 2 && o.prog && o.prog.ex && o.prog.sessions){
    n = o;
  } else {
    n = blank();
    for (const k in n.weights) if (typeof o.weights[k] === "number") n.weights[k] = o.weights[k];
    n.history = o.history; n.live = o.live || null;
  }
  /* read before the defaults are merged in, or the flag would always look set */
  const needMuscles = o.v === 2 && !(o.settings && o.settings.muscles === 2);
  n.v = 2;
  n.settings = Object.assign(DEFAULTS(), n.settings || {});
  n.history = Array.isArray(n.history) ? n.history.filter(r => r && Array.isArray(r.entries)) : [];
  if (!Array.isArray(n.prog.order)) n.prog.order = Object.keys(n.prog.sessions);
  n.prog.order = n.prog.order.filter(id => n.prog.sessions[id]);
  for (const id in n.prog.sessions) if (!n.prog.order.includes(id)) n.prog.order.push(id);
  for (const id of n.prog.order){
    const s = n.prog.sessions[id];
    s.plan = (s.plan || []).filter(p => Array.isArray(p) && n.prog.ex[p[0]]);
    if (!Number.isInteger(s.day)) s.day = null;
  }
  for (const k in n.prog.ex){
    const e = n.prog.ex[k];
    if (!e.kind) e.kind = e.bar ? "bar" : (e.db ? "db" : "machine");
    if (!(e.rest > 0)) e.rest = DEFAULT_REST[k] || (e.kind === "bar" ? 150 : 75);
    if (!e.group){                   /* first load after groups existed: fill them in once */
      e.group = DEFAULT_GROUP[k] || guessGroup(e.name);
      if (e.kind === "machine" && CABLE.includes(k)) e.kind = "cable";
    }
    if (!BARS.includes(e.barKg)) e.barKg = DEFAULT_BAR[k] || BARBELL;
    if (typeof n.weights[k] !== "number") n.weights[k] = e.start;
  }
  /* Once: the six broad groups become specific muscles. A default exercise still in its
     default region takes its default muscle; anything else is guessed from its name within
     the region it was given, falling back to that region's main muscle. */
  if (needMuscles){
    for (const k in n.prog.ex){
      const e = n.prog.ex[k], was = regionOf(e.group);
      if (DEFAULT_GROUP[k] && regionOf(DEFAULT_GROUP[k]) === was) e.group = DEFAULT_GROUP[k];
      else if (!MUSCLE[e.group] || e.group === was){
        const g = guessGroup(e.name);
        e.group = regionOf(g) === was ? g : (REGION_DEFAULT[was] || g);
      }
    }
  }
  n.settings.muscles = 2;
  for (const k in n.prog.ex){
    const e = n.prog.ex[k];
    const ok = Array.isArray(e.muscles) ? [...new Set(e.muscles.filter(m => MUSCLE[m]))] : [];
    e.muscles = ok.length ? ok : [e.group];
    e.group = e.muscles[0];
  }
  for (const r of n.history){
    if (!r.name && n.prog.sessions[r.id]) r.name = n.prog.sessions[r.id].name;
    for (const x of r.entries) if (!x.name && n.prog.ex[x.k]) x.name = n.prog.ex[x.k].name;
  }
  if (n.live && (!n.live.log || !n.prog.sessions[n.live.id])) n.live = null;
  return n;
}
function load(){
  let o = null, fromOld = false;
  try { o = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!o){ try { o = JSON.parse(localStorage.getItem(OLDKEY)); fromOld = !!o; } catch (e) {} }
  S = migrate(o) || blank();
  if (fromOld) save();              /* write the v2 key straight away; v1 stays as a fallback copy */
}
let storageOK = true, persisted = null, toastT;   /* persisted: null unknown, true/false answered */
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) {
    storageOK = false;
    toast("This browser is not saving anything. Export a backup now.");
  }
}
/* Ask the browser not to evict the data. Chrome and Firefox answer; Safari has no
   such API, and instead exempts apps added to the home screen. */
function askPersist(){
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted()
      .then(ok => ok || navigator.storage.persist())
      .then(ok => { persisted = !!ok; if (tab === "more") render(); })
      .catch(() => {});
  } catch (e) {}
}
function sinceBackup(){ return Math.max(0, S.history.length - (S.settings.lastBackupCount || 0)); }
function noteBackup(){
  S.settings.lastBackupAt = new Date().toISOString();
  S.settings.lastBackupCount = S.history.length;
  save();
}
function backupNow(){
  dl(`barload-backup-${todayISO()}.json`, JSON.stringify(S), "application/json");
  noteBackup();
  toast("Backup saved. Keep it in Files or Drive.");
  render();
}
load();
try { localStorage.setItem(KEY, JSON.stringify(S)); }   /* prove storage works before anything is logged */
catch (e) { storageOK = false; }
askPersist();

/* ── helpers ───────────────────────────────────────────────────────────── */
const kg = n => (n === null || n === undefined || n === "" || Number.isNaN(n)) ? "—"
              : (Math.round(n * 100) / 100).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const csvq = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
const pad2 = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayISO = () => iso(new Date());
const dow = d => (d.getDay() + 6) % 7;               /* Monday = 0 */
const fmtDate = s => new Date(s + "T12:00:00")
  .toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const hasDay = s => Number.isInteger(s.day);
const setsOf = s => s.plan.reduce((a, p) => a + p[1], 0);
const usedIn = k => S.prog.order.filter(id => S.prog.sessions[id].plan.some(p => p[0] === k));
const hasHistory = k => S.history.some(r => r.entries.some(x => x.k === k));
const exName = x => (S.prog.ex[x.k] || {}).name || x.name || x.k;
const sessName = r => (S.prog.sessions[r.id] || {}).name || r.name || r.id;
const tonnage = r => r.entries.reduce((a, x) => a + x.reps.reduce((b, n) => b + (n || 0) * (x.weight || 0), 0), 0);
const listJoin = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const mmss = n => `${Math.floor(n / 60)}:${pad2(n % 60)}`;
const restLabel = n => n < 60 ? `${n} s` : n % 60 ? `${Math.floor(n / 60)} min ${n % 60} s` : `${n / 60} min`;
function short(n){
  const w = n.trim().split(/\s+/);
  return w.length > 1 ? w[0].slice(0, 2) + " " + w[w.length - 1].slice(0, 2) : n.slice(0, 4);
}
function newId(name){
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "ex";
  let k = slug, i = 2;
  while (S.prog.ex[k]) k = slug + i++;
  return k;
}
function weekDates(){
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const mon = new Date(t); mon.setDate(t.getDate() - dow(t));
  return DAYS.map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return iso(d); });
}
function weekNo(){
  const st = S.settings.startDate;
  if (!st || !/^\d{4}-\d{2}-\d{2}$/.test(st)) return null;
  const a = new Date(st + "T12:00:00"), b = new Date(); b.setHours(12, 0, 0, 0);
  if (Number.isNaN(a.getTime())) return null;
  a.setDate(a.getDate() - dow(a)); b.setDate(b.getDate() - dow(b));
  return Math.floor(Math.round((b - a) / 864e5) / 7) + 1;
}
function plateBreak(total, bar = BARBELL){
  let side = (total - bar) / 2;
  if (side < 0) return null;
  const out = [];
  for (const [w, col, h] of PLATES){
    while (side >= w - 1e-9){ out.push([w, col, h]); side -= w; }
  }
  return {plates:out, left:Math.round(side * 100) / 100};
}

function toast(msg){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);z-index:60;"
      + "bottom:calc(78px + env(safe-area-inset-bottom,0px));"
      + "background:#101418;color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;"
      + "max-width:88%;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.25);transition:opacity .25s;pointer-events:none";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.opacity = "0"; }, 2600);
}

/* ── live session ──────────────────────────────────────────────────────── */
/* planN is the plan's set count this entry was built from, so a later change in Plan can
   be told apart from a "+ set" made during the workout. */
function liveEntry(k, n){
  const e = S.prog.ex[k];
  return {k, name:e.name, lo:e.lo, hi:e.hi, inc:e.inc, kind:e.kind, rest:e.rest, group:e.group, muscles:musclesOf(e), barKg:e.barKg,
          weight:S.weights[k], reps:new Array(n).fill(null), planN:n};
}
function startSession(id){
  const s = S.prog.sessions[id];
  if (!s || !s.plan.length){ toast("That session has no exercises yet. Add some in Plan."); return; }
  S.live = {id, date: todayISO(), open: 0, log: s.plan.map(([k, n]) => liveEntry(k, n))};
  save(); go("train");
}
/* Plan edits reach the workout in progress. Exercises and their order follow the plan, a
   set count changed in Plan applies, and nothing already logged is ever dropped: a set
   count never cuts below the last logged set, and a removed exercise with logged sets
   stays, at the end. Returns whether the workout changed. */
function syncLive(){
  const L = S.live, s = L && S.prog.sessions[L.id];
  if (!s) return false;
  const shape = log => JSON.stringify(log.map(x => [x.k, x.reps.length]));
  const before = shape(L.log), openX = L.log[L.open];
  const pool = new Map(L.log.map(x => [x.k, x])), log = [];
  for (const [k, n] of s.plan){
    let x = pool.get(k);
    if (x){
      pool.delete(k);
      if (x.planN === undefined) x.planN = x.reps.length;
      if (x.planN !== n){
        const last = x.reps.reduce((a, r, j) => r !== null ? j : a, -1), len = Math.max(n, last + 1);
        x.reps = x.reps.slice(0, len);
        while (x.reps.length < len) x.reps.push(null);
        x.planN = n;
      }
    } else x = liveEntry(k, n);
    log.push(x);
  }
  for (const x of pool.values()) if (x.reps.some(r => r !== null)) log.push(x);
  L.log = log;
  L.open = openX ? log.indexOf(openX) : -1;
  rrOpen = -1;
  return shape(log) !== before;
}
/* The current programme definition wins; the snapshot covers an exercise deleted mid-session. */
const liveDef = x => S.prog.ex[x.k]
  || {name:x.name, lo:x.lo, hi:x.hi, inc:x.inc, kind:x.kind, rest:x.rest, group:x.group, muscles:x.muscles, barKg:x.barKg || BARBELL};

function hitTop(entry){
  const e = liveDef(entry);
  return entry.reps.every(r => r !== null) && Math.min(...entry.reps) >= e.hi;
}
function anyLogged(){
  return !!S.live && S.live.log.some(x => x.reps.some(r => r !== null));
}

function finishSession(){
  const L = S.live;
  const entries = L.log.filter(x => x.reps.some(r => r !== null));
  if (!entries.length){ toast("Log at least one set first."); return; }
  const gains = [];
  for (const x of entries){
    if (hitTop(x) && S.prog.ex[x.k]){
      S.weights[x.k] = Math.round(((S.weights[x.k] || 0) + liveDef(x).inc) * 100) / 100;
      gains.push(x.name);
    }
  }
  const rec = {date:L.date, id:L.id, name:sessName({id:L.id}),
               entries:entries.map(x => ({k:x.k, name:exName(x), weight:x.weight, reps:x.reps}))};
  S.history.unshift(rec);
  S.live = null; rrOpen = -1;
  save();
  toast(gains.length ? `Saved. ${gains.length} weight${gains.length > 1 ? "s" : ""} went up.` : "Session saved.");
  if (S.settings.autosave){
    const slug = rec.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    dl(`barload-${rec.date}-${slug}.json`, JSON.stringify(S), "application/json");
    noteBackup();
  }
  go("train");
}

/* ── rest timer ────────────────────────────────────────────────────────────
   State lives on S.live.rest as an end timestamp, so backgrounding the app or
   reloading it shows the true time left rather than a frozen count. */
let tickT = null, audio = null, wakeLock = null;
/* Keeping the screen on is what makes the beep and the vibration reliable: both
   Safari and Chrome suspend a page's JavaScript once the screen locks, whether that
   lock was automatic (idle timeout) or the power button. Wake Lock only prevents the
   automatic one, which is what actually happens mid-rest when nobody is touching the
   phone, so it covers the case that matters without needing a page reload to notice. */
async function acquireWake(){
  try {
    if (wakeLock || !("wakeLock" in navigator) || document.hidden) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
function releaseWake(){
  if (wakeLock){ const w = wakeLock; wakeLock = null; w.release().catch(() => {}); }
}
function ensureAudio(){
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) {}
}
function beep(){
  try { if (navigator.vibrate) navigator.vibrate([200, 80, 200]); } catch (e) {}
  if (!S.settings.sound || !audio) return;
  try {
    const t = audio.currentTime;
    for (const d of [0, .2, .4]){
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + .01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + .15);
      o.start(t + d); o.stop(t + d + .16);
    }
  } catch (e) {}
}
function startRest(x){
  const e = liveDef(x), secs = e.rest > 0 ? e.rest : 75;
  S.live.rest = {name:e.name, end:Date.now() + secs * 1000, total:secs, done:false};
  save(); tick(); acquireWake();
}
function stopRest(){
  if (S.live && S.live.rest){ S.live.rest = null; save(); }
  tick();
}
function nudgeRest(d){
  const R = S.live && S.live.rest;
  if (!R) return;
  R.end = Math.max(Date.now(), R.end + d * 1000); R.done = false;
  save(); tick();
  if (R.end > Date.now()) acquireWake();
}
/* What the next set is, for the go screen: the first empty set from the open exercise on. */
function nextUp(){
  const L = S.live;
  if (!L) return "";
  const n = L.log.length, from = L.open >= 0 ? L.open : 0;
  for (let j = 0; j < n; j++){
    const x = L.log[(from + j) % n], si = x.reps.indexOf(null);
    if (si >= 0) return `Next: ${liveDef(x).name}, set ${si + 1} at ${kg(x.weight)} kg`;
  }
  return "";
}
function tick(){
  clearTimeout(tickT);
  const el = document.getElementById("rest"), goEl = document.getElementById("go"), R = S.live && S.live.rest;
  const over = !!R && R.end <= Date.now() && Date.now() - R.end <= 12000;
  if (over && goEl.classList.contains("hide")) document.getElementById("goNext").textContent = nextUp();
  goEl.classList.toggle("hide", !over);
  if (!R){ el.classList.add("hide"); releaseWake(); return; }
  const left = Math.ceil((R.end - Date.now()) / 1000);
  el.classList.remove("hide");
  document.getElementById("restName").textContent = R.name;
  if (left > 0){
    el.classList.remove("over");
    document.getElementById("restTime").textContent = mmss(left);
  } else {
    if (Date.now() - R.end > 12000){ S.live.rest = null; save(); el.classList.add("hide"); releaseWake(); return; }
    el.classList.add("over");
    document.getElementById("restTime").textContent = "Go";
    if (!R.done){ R.done = true; save(); beep(); releaseWake(); }
  }
  tickT = setTimeout(tick, 250);
}
document.getElementById("restMinus").onclick = () => { ensureAudio(); nudgeRest(-15); };

/* ── rep pad ───────────────────────────────────────────────────────────── */
let padCtx = null;
const scrim = document.getElementById("scrim"), pad = document.getElementById("pad");

const range = document.getElementById("padRange");
/* A slider position as a CSS length, corrected for the thumb so ticks sit under its centre. */
const track = document.getElementById("padTrack");
const SPACING = 24;                  /* px per rep: about fourteen reps in view, not the whole range */
/* A tick of feedback per rep. Android: navigator.vibrate, which works from any handler once
   the page has been touched. iPhone browsers have no vibration API; toggling a switch-style
   checkbox plays the system haptic (iOS 18 and later), but WebKit only does so while it is
   handling the user's own touch, not from a scroll event. So the switch is flipped from the
   finger's touch events, and the scroll event only ever vibrates. */
let hapticEl = null, tickedAt = null;
const canVibrate = () => typeof navigator.vibrate === "function";
function vibrateTick(){
  if (!S.settings.haptics || !canVibrate()) return false;
  try { return navigator.vibrate(8) !== false; } catch (e) { return false; }
}
/* Ways to flip a switch nobody sees. Which one iOS answers with a tick could not be tested
   off-device, so the Haptics card in More tries each and the ruler uses the one chosen:
     hidden  the switch is not rendered at all (display:none), flipped through its label
     faint   rendered on screen but all but invisible, flipped through its label
     direct  rendered the same way, flipped by clicking the switch itself */
const HAPTIC_MODES = ["hidden", "faint", "direct"];
const hapticEls = {};
function switchEl(mode){
  if (hapticEls[mode]) return hapticEls[mode];
  const l = document.createElement("label"), i = document.createElement("input");
  l.setAttribute("aria-hidden", "true");
  l.style.cssText = mode === "hidden" ? "display:none"
    : "position:fixed;left:0;bottom:0;opacity:.011;pointer-events:none;z-index:0";
  i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l);
  return (hapticEls[mode] = l);
}
function switchTick(mode){
  if (!S.settings.haptics) return;
  mode = HAPTIC_MODES.includes(mode) ? mode : S.settings.hapticMode;
  try {
    const l = switchEl(mode);
    hapticEl = l;
    if (mode === "direct") l.firstChild.click(); else l.click();
  } catch (e) {}

/* One tick from inside a user event: whichever mechanism this browser has. */
function haptic(){ if (!vibrateTick()) switchTick(); }
/* Best first guess for a set: what is already there, else the set before it this session,
   else the same set last time, else the bottom of the range. */
function guessReps(x, si, e){
  if (x.reps[si] !== null) return x.reps[si];
  for (let j = si - 1; j >= 0; j--) if (x.reps[j] !== null) return x.reps[j];
  const last = S.history.find(r => r.entries.some(y => y.k === x.k));
  if (last){
    const y = last.entries.find(z => z.k === x.k), v = y.reps[si] ?? y.reps.filter(r => r !== null).pop();
    if (typeof v === "number") return v;
  }
  return e.lo;
}
/* scroll: move the ruler to match (not when the ruler itself is what moved) */
function setPadVal(n, scroll = true){
  const x = S.live.log[padCtx.ei], e = liveDef(x), max = +range.max;
  n = Math.max(0, Math.min(max, Math.round(n)));
  padCtx.n = n; range.value = n;
  track.querySelectorAll(".rt").forEach((t, v) => t.classList.toggle("lit", v <= n));
  if (scroll) track.scrollLeft = n * SPACING;
  document.getElementById("padNum").textContent = n;
  const z = document.getElementById("padZone");
  z.className = "zone" + (n >= e.hi ? " top" : n >= e.lo ? " in" : "");
  z.textContent = n >= e.hi ? "Top of the range" : n >= e.lo ? "In range" : `${e.lo - n} short of the range`;
}
function openPad(ei, si){
  padCtx = {ei, si};
  const x = S.live.log[ei], e = liveDef(x), max = Math.max(30, e.hi + 10);
  document.getElementById("padTitle").textContent = e.name;
  document.getElementById("padSub").textContent =
    `Set ${si + 1} of ${x.reps.length} · ${kg(x.weight)} kg · target ${e.lo}–${e.hi}`;
  range.max = max;
  let h = `<span class="rpad"></span>`;
  for (let v = 0; v <= max; v++){
    const z = v >= e.lo && v <= e.hi;
    const zc = z ? " z" + (v === e.lo ? " zs" : "") + (v === e.hi ? " ze" : "") : "";
    h += `<span class="rt${zc}" data-v="${v}"><b>${v % 5 === 0 ? v : ""}</b><i></i></span>`;
  }
  track.innerHTML = h + `<span class="rpad"></span>`;
  scrim.classList.add("on"); pad.classList.add("on");
  setPadVal(guessReps(x, si, e));     /* after the sheet is shown, so the ruler has a width */

/* The ruler drives the value as it scrolls; each new rep gives a haptic tick. */
const repAt = () => Math.max(0, Math.min(+range.max, Math.round(track.scrollLeft / SPACING)));
track.addEventListener("scroll", () => {
  if (!padCtx) return;
  const n = repAt();

}, {passive:true});
/* On iPhone the tick has to come from the touch itself: each time the finger's movement

const touchTick = () => {

  const n = repAt();

track.addEventListener("touchstart", () => { tickedAt = repAt(); }, {passive:true});
track.addEventListener("touchmove", touchTick, {passive:true});
track.addEventListener("touchend", touchTick, {passive:true});
/* Tapping a tick scrolls it under the pointer. */
track.addEventListener("click", ev => {
  const t = ev.target.closest(".rt");
  if (t) track.scrollTo({left:+t.dataset.v * SPACING, behavior:"smooth"});
});
function logRep(){
  if (!padCtx) return;
  const x = S.live.log[padCtx.ei];
  x.reps[padCtx.si] = padCtx.n;
  save();
  ensureAudio();                      /* a tap is the gesture iOS needs before any sound */
  closePad();
  const allDone = S.live.log.every(y => y.reps.every(r => r !== null));
  if (allDone) stopRest(); else startRest(x);
  render();
}
range.oninput = () => setPadVal(+range.value);
document.getElementById("padLog").onclick = logRep;
function closePad(){ padCtx = null; scrim.classList.remove("on"); pad.classList.remove("on"); }
scrim.onclick = closePad;
document.getElementById("padClose").onclick = closePad;
document.getElementById("padClear").onclick = () => {
  if (!padCtx) return;
  S.live.log[padCtx.ei].reps[padCtx.si] = null;
  save(); closePad(); render();
};

/* ── views ─────────────────────────────────────────────────────────────── */
let tab = "train", edit = null, openKey = null, openHist = null, rrOpen = -1;

      v.innerHTML = liveView();

    } else {
      H.textContent = "Barload";

      sub.textContent = (wn === null ? "" : wn < 1 ? `Starts ${fmtDate(S.settings.startDate)} · `
                        : `Week ${wn}${wn <= 12 ? " of 12" : ""} · `) + fmtDate(todayISO());

/* ── train: picker ─────────────────────────────────────────────────────── */
function pickView(){
  const wk = weekDates(), today = todayISO();
  let h = "";
  if (!storageOK){
    h += `<div class="card alert"><h2>Nothing is being saved</h2>
      <p>This browser is refusing to store data, usually private browsing or a full disk.
         Anything you log now is lost when you close the app. Export a backup from More after
         each session, or open the app in a normal window.</p></div>`;
  } else if (sinceBackup() >= 4){
    h += `<div class="card nag"><h2>Time for a backup</h2>
      <p>${sinceBackup()} sessions logged since your last backup file. This phone holds the only copy.</p>
      <button class="primary" id="nagbk">Save a backup file</button></div>`;
  }
  h += `<div class="week">`;
  wk.forEach((d, i) => {
    const sid = S.prog.order.find(id => S.prog.sessions[id].day === i);
    const logged = S.history.filter(r => r.date === d);
    let dot = "", label = "—", cls = "";
    if (logged.length){ dot = "done"; label = short(sessName(logged[0])); }
    else if (sid){ label = short(S.prog.sessions[sid].name); dot = d === today ? "up" : (d < today ? "miss" : ""); }
    else cls = "rest";
    if (d === today) cls += " today";
    h += `<button class="${cls.trim()}"${sid ? ` data-start="${sid}"` : " disabled"} title="${DAYFULL[i]}">
      <span class="d">${DAYS[i]} ${+d.slice(8)}</span><span class="s">${esc(label)}</span><i class="dot ${dot}"></i></button>`;
  });
  h += `</div>`;
  const todayId = S.prog.order.find(id => S.prog.sessions[id].day === dow(new Date()));
  const doneToday = S.history.filter(r => r.date === today);
  if (doneToday.length){
    h += `<div class="card"><h2>${esc(sessName(doneToday[0]))} done today</h2>
      <p>${Math.round(tonnage(doneToday[0])).toLocaleString()} kg moved. Eat, sleep, come back.</p></div>`;
  } else if (todayId){
    const s = S.prog.sessions[todayId];
    h += `<div class="card"><h2>Today is ${esc(s.name)}</h2>
      <p>${s.plan.length} exercises, ${setsOf(s)} working sets.</p>
      <button class="primary" data-start="${todayId}">Start ${esc(s.name)}</button></div>`;
  } else {
    const days = S.prog.order.filter(id => hasDay(S.prog.sessions[id]))
      .map(id => S.prog.sessions[id].day).sort((a, b) => a - b).map(d => DAYFULL[d]);
    h += `<div class="card"><h2>Rest day</h2>
      <p>${days.length ? `Nothing scheduled. Training runs ${listJoin(days)}.`
                       : "No sessions have a day yet. Set them in Plan."}</p></div>`;
  }
  h += `<div class="grp">Or pick a session</div><div class="pick">`;
  for (const id of S.prog.order){
    const s = S.prog.sessions[id];
    const gs = [...new Set(s.plan.flatMap(([k]) => musclesOf(S.prog.ex[k]).map(regionOf)))]
      .sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
    h += `<button data-start="${id}"><b>${esc(s.name)}</b>
      <span>${setsOf(s)} sets${hasDay(s) ? " · " + DAYFULL[s.day] : ""}</span>
      <span class="gdots" aria-hidden="true">${gs.map(g => `<i style="background:${gcol(g)}"></i>`).join("")}</span></button>`;
  }
  h += `</div>`;
  if (S.history.length){
    h += `<div class="grp">Recent</div>`;
    S.history.slice(0, 5).forEach((r, i) =>
      h += `<button class="hist" data-hist="${i}"><b>${esc(sessName(r))}</b>
        <span>${fmtDate(r.date)}</span><span>${Math.round(tonnage(r)).toLocaleString()} kg</span>
        <span class="chev">›</span></button>`);
  }
  return h;
}

/* ── train: live session ───────────────────────────────────────────────── */

      <button class="ex-head" data-open="${i}">
        ${icon(e)}
        <div class="ex-name"><b>${esc(e.name)}</b><span>${x.reps.length} set${x.reps.length === 1 ? "" : "s"}, ${e.lo}–${e.hi} reps · rest ${mmss(e.rest || 75)}</span></div>
        <div class="ex-kg">${kg(x.weight)}<small>kg</small></div>

    if (open){

        <div class="hero"><div class="kg">${kg(x.weight)}</div><div class="unit">kg</div>
          <div class="adj"><button data-w="${i}:-1" aria-label="Lighter">−</button><button data-w="${i}:1" aria-label="Heavier">+</button></div>

        h += `<button class="${cls}" data-set="${i}:${si}">

      });

        <div class="setctl">
          <button data-nset="${i}:-1"${x.reps.length <= 1 ? " disabled" : ""}>− set</button>

        </div>`;
      if (done){
        h += hitTop(x)
          ? `<p class="note up">Next time: ${kg(x.weight + e.inc)} kg</p>`

function rrEditor(i, e){
  const shared = usedIn(liveKey(i)).length > 1;
  const stp = (end, v) => `<div class="stp"><button data-rrb="${i}:${end}:-1" aria-label="Lower">−</button>

    <div><label>Reps to</label>${stp("hi", e.hi)}</div>
